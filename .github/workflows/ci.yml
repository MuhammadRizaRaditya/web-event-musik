name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: '20'
            package: 'web'
          - node-version: '20'
            package: 'api'

    steps:
      - name: Checkout repository
      uses: actions/checkout@v4

      - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

      - name: Install dependencies
      run: cd packages/${{ matrix.package }} && npm install

      - name: Run typecheck
      run: cd packages/${{ matrix.package }} && npm run typecheck

      - name: Run lint
      run: cd packages/${{ matrix.package }} && npm run lint

      - name: Run tests
      run: cd packages/${{ matrix.package }} && npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: '20'
            package: 'web'
          - node-version: '20'
            package: 'api'

    steps:
      - name: Checkout repository
      uses: actions/checkout@v4

      - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

      - name: Install dependencies
      run: cd packages/${{ matrix.package }} && npm install

      - name: Build application
      run: cd packages/${{ matrix.package }} && npm run build

  prisma-generate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      uses: actions/checkout@v4

      - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

      - name: Install dependencies
      run: npm install

      - name: Generate Prisma Client
      run: npx prisma generate

  db-push:
    needs: prisma-generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
      uses: actions/checkout@v4

      - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

      - name: Install dependencies
      run: npm install

      - name: Push Prisma schema
      run: npx prisma db push